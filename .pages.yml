media:
  input: public/images
  output: /images
content:
  - name: projects
    label: Architecture Projects
    type: collection
    path: src/data/projects
    format: json
    fields:
      - name: title
        label: Project Title
        type: string
      - name: client
        label: Client / Class
        type: string
      - name: coverImage
        label: Cover Image
        type: image
      - name: description
        label: Project Description
        type: rich-text